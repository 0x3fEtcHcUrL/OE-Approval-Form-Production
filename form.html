<script>
  flatpickr("#firstDay", {
    dateFormat: "d-m-Y",
    altInput: true,
    altFormat: "F j, Y",
    onChange: calculateWorkingDays
  });

  flatpickr("#lastDay", {
    dateFormat: "d-m-Y",
    altInput: true,
    altFormat: "F j, Y",
    onChange: calculateWorkingDays
  });

  function parseDMY(dmy) {
    const [day, month, year] = dmy.split('-').map(Number);
    return new Date(year, month - 1, day);
  }

  function calculateWorkingDays(startDateStr, endDateStr) {
    const startStr = document.getElementById("firstDay").value;
    const endStr = document.getElementById("lastDay").value;
    const startDate = parseDMY(startStr);
    const endDate = parseDMY(endStr);

    // Validasi
    if (!startDate || !endDate || startDate > endDate) {
      document.getElementById("totalDays").value = "";
      return;
    }

    let daysCount = 0;
    let current = new Date(startDate);

    while (current <= endDate) {
      const day = current.getDay();
      // 0 = Sunday, 6 = Saturday → skip
      if (day !== 0 && day !== 6) {
        daysCount++;
      }
      current.setDate(current.getDate() + 1);
    }

    document.getElementById("totalDays").value = daysCount;
  }

  function calculateWorkingDaysSync(startStr, endStr) {
    const startDate = parseDMY(startStr);
    const endDate = parseDMY(endStr);
    if (!startDate || !endDate || startDate > endDate) return 0;

    let days = 0;
    const current = new Date(startDate);

    while (current <= endDate) {
      const day = current.getDay();
      if (day !== 0 && day !== 6) days++;
      current.setDate(current.getDate() + 1);
    }

    return days;
  }

  function isLeaveBalanceEnough(balance, leaveType, requestedDays) {
    const available = leaveType === "Sick Leave" ? balance.sick : balance.leave;
    return requestedDays <= available;
  }

  let isSuccess = false;

  document.getElementById("leaveForm").addEventListener("submit", function (e) {
    e.preventDefault();

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim();
    const department = document.getElementById("department").value;
    const leaveType = document.getElementById("leaveType").value;
    const firstDay = document.getElementById("firstDay").value;
    const lastDay = document.getElementById("lastDay").value;
    const reason = document.getElementById("reason").value.trim();

    if (!name || !email || !department || !leaveType || !firstDay || !lastDay || !reason) {
      alert("Please fill in all required fields.");
      return;
    }

    const submitBtn = document.getElementById("submitBtn");
    const loadingScreen = document.getElementById("loadingScreen");
    const resultModalEl = document.getElementById("resultModal");
    const resultModal = new bootstrap.Modal(resultModalEl);
    const resultBody = document.getElementById("resultModalBody");
    const modalFooter = document.getElementById("resultModalFooter");

    isSuccess = false;
    submitBtn.disabled = true;
    loadingScreen.style.display = "block";

    const requestedDays = calculateWorkingDaysSync(firstDay, lastDay);

    // Skip balance validation for WFH and Unpaid Leave
    if (leaveType === "Working From Home (WFH)" || leaveType === "Unpaid Leave") {
      proceedToSubmit();
      return;
    }

    // Validate leave balance
    google.script.run
      .withSuccessHandler((balance) => {
        if (!balance) {
          loadingScreen.style.display = "none";

          const emailField = document.getElementById("email");
          emailField.classList.add("is-invalid");

          resultBody.innerHTML = `
            <div class="alert alert-danger text-dark">
              <strong>Email Not Registered</strong><br><br>
              Your email <code>${email}</code> is not registered in our system.<br>
              Are you sure thats your office email?
            </div>`;

          resultModal.show();
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit Request";
          return;
        } else {
          document.getElementById("email").classList.remove("is-invalid");
        }

        if (!isLeaveBalanceEnough(balance, leaveType, requestedDays)) {
          const available = leaveType === "Sick Leave" ? balance.sick : balance.leave;
          loadingScreen.style.display = "none";
          resultBody.innerHTML = `
            <div class="alert alert-warning text-dark">
              <strong>Submission Rejected:</strong><br><br>
              Your request is for <strong>${requestedDays}</strong> day(s) of <strong>${leaveType}</strong>.<br>
              <span style="color:red;">Unfortunately, you only have <strong>${available}</strong> remaining leave day(s) available.</span><br>
              Kindly reach out to HR for further information.
            </div>`;
            
          resultModal.show();
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit Request";
          return;
        }

        proceedToSubmit(balance);
      })
      .withFailureHandler(() => {
        loadingScreen.style.display = "none";
        resultBody.innerHTML = `<div class="alert alert-danger"><strong>Error:</strong> Could not fetch leave balance. Please try again.</div>`;
        resultModal.show();
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Request";
      })
      .getLeaveBalanceByEmail(email);

    function proceedToSubmit(balanceInfo = null) {
      google.script.run
        .withSuccessHandler((result) => {
          loadingScreen.style.display = "none";

          if (result === "Success") {
            const balanceContent = balanceInfo
              ? `
              <p>Your current leave balance:</p>
              <ul>
                <li>Annual Leave: <strong>${balanceInfo.leave}</strong> days</li>
                <li>Sick Leave: <strong>${balanceInfo.sick}</strong> days</li>
              </ul>`
              : `<p class="text-muted">No balance check required for this leave type.</p>`;

            resultBody.innerHTML = `
              <div class="alert alert-success">
                <strong>Success!</strong> Your leave request has been submitted.
                <hr>
                <p><strong>${name}</strong> (${email})</p>
                ${balanceContent}
                <p class="text-dark"><strong>Note:</strong> If your remaining leave balance is insufficient, the request will be automatically rejected.</p>
              </div>`;

            modalFooter.innerHTML = `
              <button type="button" class="btn btn-outline-info" id="newFormBtn">Make a New Request</button>
              <button type="button" class="btn btn-outline-danger" id="closeTabBtn">Close This Tab</button>`;

            resultModal.show();
            submitBtn.innerText = "Success 🎉";
            isSuccess = true;

            setTimeout(() => {
              document.getElementById("newFormBtn").addEventListener("click", () => {
                document.getElementById("leaveForm").reset();
                submitBtn.disabled = false;
                submitBtn.innerText = "Submit Request";
                resultModal.hide();
              });

              document.getElementById("closeTabBtn").addEventListener("click", () => {
                resultBody.innerHTML = `<div class="alert alert-info">Thank you. This tab will close shortly...</div>`;
                modalFooter.innerHTML = '';
                setTimeout(() => {
                  window.close();
                  setTimeout(() => {
                    if (!window.closed) {
                      resultBody.innerHTML = `
                        <div class="alert alert-warning text-dark">
                          <strong>Notice:</strong> Your browser prevented this tab from closing automatically.<br>
                          You can safely close this tab now.
                        </div>`;
                    }
                  }, 1500);
                }, 1000);
              });
            }, 100);
          } else {
            resultBody.innerHTML = `<div class="alert alert-danger"><strong>Error:</strong> ${result}</div>`;
            resultModal.show();
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit Request";
          }
        })
        .withFailureHandler(() => {
          loadingScreen.style.display = "none";
          resultBody.innerHTML = `<div class="alert alert-danger"><strong>Submission Failed:</strong> Please try again later or refresh this page.</div>`;
          resultModal.show();
          submitBtn.disabled = false;
          submitBtn.innerText = "Submit Request";
        })
        .submitRequest(name, email, department, leaveType, firstDay, lastDay, reason);
    }

    resultModalEl.addEventListener('hidden.bs.modal', () => {
      if (isSuccess) {
        document.getElementById("leaveForm").reset();
        submitBtn.disabled = false;
        submitBtn.innerText = "Submit Request";
      }
    }, { once: true });
  });
</script>
